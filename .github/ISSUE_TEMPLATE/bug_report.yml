name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not paste API keys, tokens, private code or report contents.
        Security problems: use private vulnerability reporting instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: For a scan, say what kind of sources were connected (e.g. one public GitHub repo) — not their names.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: From the run's event stream or the server output. Remove anything private.
      render: text
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown in Settings, or `version` in package.json.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run it?
      options: [npm start, Docker, other]
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and Node version
